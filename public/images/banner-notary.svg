<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161420"/>
      <stop offset="100%" stop-color="#0B0A10"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg1)"/>
  <circle cx="180" cy="90" r="180" fill="#A259FF" opacity="0.35" filter="url(#blur1)"/>
  <circle cx="1050" cy="330" r="160" fill="#5B8CFF" opacity="0.3" filter="url(#blur1)"/>

  <!-- chain links -->
  <g stroke="#A259FF" stroke-width="6" fill="none" opacity="0.55">
    <rect x="120" y="200" width="70" height="46" rx="23"/>
    <rect x="178" y="200" width="70" height="46" rx="23"/>
    <rect x="236" y="200" width="70" height="46" rx="23"/>
  </g>

  <!-- document card -->
  <g transform="translate(500,90)">
    <rect x="0" y="0" width="200" height="240" rx="14" fill="#1D1A28" stroke="#2A2635" stroke-width="2"/>
    <rect x="24" y="34" width="152" height="10" rx="5" fill="#F5F3F8" opacity="0.85"/>
    <rect x="24" y="60" width="120" height="8" rx="4" fill="#726B82"/>
    <rect x="24" y="80" width="130" height="8" rx="4" fill="#726B82"/>
    <rect x="24" y="100" width="100" height="8" rx="4" fill="#726B82"/>
    <!-- lock badge -->
    <circle cx="100" cy="175" r="42" fill="#0B0A10" stroke="#A259FF" stroke-width="3"/>
    <rect x="82" y="168" width="36" height="28" rx="5" fill="none" stroke="#A259FF" stroke-width="4"/>
    <path d="M88 168 v-10 a12 12 0 0 1 24 0 v10" fill="none" stroke="#A259FF" stroke-width="4"/>
  </g>

  <!-- hash grid lines -->
  <g stroke="#5B8CFF" stroke-width="2" opacity="0.4">
    <line x1="820" y1="60" x2="820" y2="340"/>
    <line x1="870" y1="60" x2="870" y2="340"/>
    <line x1="760" y1="120" x2="1040" y2="120"/>
    <line x1="760" y1="180" x2="1040" y2="180"/>
  </g>
  <g fill="#A259FF" opacity="0.85">
    <circle cx="820" cy="120" r="6"/>
    <circle cx="870" cy="180" r="6"/>
    <circle cx="940" cy="120" r="5"/>
    <circle cx="990" cy="180" r="5"/>
  </g>
</svg>
