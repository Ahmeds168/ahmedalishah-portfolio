<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F7F7FE"/>
    </linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="170" fill="#7C3AED" opacity="0.10" filter="url(#b)"/>
  <circle cx="110" cy="340" r="150" fill="#2563EB" opacity="0.07" filter="url(#b)"/>

  <rect x="150" y="70" width="560" height="200" rx="12" fill="#0F172A"/>
  <circle cx="176" cy="94" r="6" fill="#EF4444"/><circle cx="196" cy="94" r="6" fill="#F59E0B"/><circle cx="216" cy="94" r="6" fill="#22C55E"/>
  <g font-family="JetBrains Mono, Menlo, monospace" font-size="15">
    <text x="176" y="140" xml:space="preserve"><tspan fill="#C4B5FD">function</tspan><tspan fill="#E2E8F0"> vote(uint id) external {</tspan></text>
    <text x="196" y="174" fill="#E2E8F0" xml:space="preserve">require(!hasVoted[<tspan fill="#FDE68A">msg.sender</tspan>],</text>
    <text x="216" y="198" xml:space="preserve"><tspan fill="#86EFAC">"You have already voted"</tspan><tspan fill="#E2E8F0">);</tspan></text>
    <text x="196" y="222" fill="#64748B">// ...</text>
    <text x="176" y="250" fill="#E2E8F0">}</text>
  </g>

  <!-- one person, many wallets -->
  <g transform="translate(830,110)">
    <circle cx="40" cy="30" r="18" fill="#111827"/>
    <rect x="18" y="52" width="44" height="40" rx="18" fill="#111827"/>
    <g stroke="#94A3B8" stroke-width="1.5" fill="none">
      <path d="M62 60 L150 0"/><path d="M62 66 L150 50"/><path d="M62 72 L150 100"/><path d="M62 78 L150 150"/>
    </g>
    <g fill="#FFFFFF" stroke="#7C3AED" stroke-width="2">
      <rect x="150" y="-14" width="70" height="28" rx="6"/><rect x="150" y="36" width="70" height="28" rx="6"/>
      <rect x="150" y="86" width="70" height="28" rx="6"/><rect x="150" y="136" width="70" height="28" rx="6"/>
    </g>
    <g font-family="JetBrains Mono, Menlo, monospace" font-size="12" fill="#5B21B6">
      <text x="160" y="5">0x7a…</text><text x="160" y="55">0x3f…</text><text x="160" y="105">0xc1…</text><text x="160" y="155">0x9e…</text>
    </g>
  </g>
  <text x="830" y="320" font-family="Inter, Helvetica, sans-serif" font-size="16" fill="#475569">one person, four "voters"</text>
</svg>
