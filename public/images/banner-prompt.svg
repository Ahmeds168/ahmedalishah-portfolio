<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="blur3"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg3)"/>
  <circle cx="150" cy="100" r="170" fill="#0891B2" opacity="0.16" filter="url(#blur3)"/>
  <circle cx="1060" cy="300" r="190" fill="#2563EB" opacity="0.16" filter="url(#blur3)"/>

  <!-- chat window -->
  <g transform="translate(430,90)">
    <rect x="0" y="0" width="340" height="220" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="34" rx="14" fill="#F8FAFF"/>
    <circle cx="22" cy="17" r="5" fill="#94A3B8"/>
    <circle cx="40" cy="17" r="5" fill="#94A3B8"/>
    <circle cx="58" cy="17" r="5" fill="#94A3B8"/>

    <rect x="22" y="56" width="160" height="26" rx="13" fill="#E5E7EB"/>
    <rect x="150" y="94" width="168" height="26" rx="13" fill="#2563EB" opacity="0.85"/>
    <rect x="22" y="132" width="200" height="26" rx="13" fill="#E5E7EB"/>
    <rect x="22" y="170" width="120" height="18" rx="9" fill="#94A3B8" opacity="0.6"/>
  </g>

  <!-- neural nodes -->
  <g stroke="#0891B2" stroke-width="2" opacity="0.6">
    <line x1="880" y1="120" x2="960" y2="90"/>
    <line x1="880" y1="120" x2="960" y2="150"/>
    <line x1="880" y1="200" x2="960" y2="90"/>
    <line x1="880" y1="200" x2="960" y2="150"/>
    <line x1="960" y1="90" x2="1040" y2="120"/>
    <line x1="960" y1="150" x2="1040" y2="120"/>
  </g>
  <g fill="#2563EB">
    <circle cx="880" cy="120" r="7"/>
    <circle cx="880" cy="200" r="7"/>
    <circle cx="960" cy="90" r="7"/>
    <circle cx="960" cy="150" r="7"/>
    <circle cx="1040" cy="120" r="8"/>
  </g>
</svg>
