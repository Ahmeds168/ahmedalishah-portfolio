<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161420"/>
      <stop offset="100%" stop-color="#0B0A10"/>
    </linearGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg4)"/>
  <circle cx="140" cy="280" r="180" fill="#FF5CA8" opacity="0.28" filter="url(#blur4)"/>
  <circle cx="1040" cy="100" r="190" fill="#A259FF" opacity="0.3" filter="url(#blur4)"/>

  <!-- broken padlock -->
  <g transform="translate(470,90)">
    <rect x="0" y="70" width="160" height="130" rx="14" fill="#1D1A28" stroke="#2A2635" stroke-width="2"/>
    <path d="M20 70 v-25 a40 40 0 0 1 80 -6" fill="none" stroke="#FF5CA8" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 70 v-10" fill="none" stroke="#FF5CA8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="80" cy="130" r="14" fill="none" stroke="#A259FF" stroke-width="5"/>
    <line x1="80" y1="140" x2="80" y2="165" stroke="#A259FF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- network / node graph representing lateral movement -->
  <g stroke="#5B8CFF" stroke-width="2" opacity="0.55">
    <line x1="760" y1="150" x2="850" y2="110"/>
    <line x1="760" y1="150" x2="850" y2="200"/>
    <line x1="850" y1="110" x2="950" y2="140"/>
    <line x1="850" y1="200" x2="950" y2="140"/>
    <line x1="950" y1="140" x2="1040" y2="100"/>
    <line x1="950" y1="140" x2="1040" y2="190"/>
  </g>
  <g fill="#A259FF">
    <circle cx="760" cy="150" r="7"/>
    <circle cx="850" cy="110" r="6"/>
    <circle cx="850" cy="200" r="6"/>
    <circle cx="950" cy="140" r="8"/>
    <circle cx="1040" cy="100" r="6"/>
    <circle cx="1040" cy="190" r="6"/>
  </g>

  <!-- alert glyph -->
  <g transform="translate(180,110)" opacity="0.85">
    <path d="M30 0 L60 55 H0 Z" fill="none" stroke="#FF5CA8" stroke-width="4" stroke-linejoin="round"/>
    <line x1="30" y1="20" x2="30" y2="36" stroke="#FF5CA8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="30" cy="46" r="2.5" fill="#FF5CA8"/>
  </g>
</svg>
