      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg2)"/>
  <circle cx="1020" cy="80" r="180" fill="#7C3AED" opacity="0.14" filter="url(#blur2)"/>
